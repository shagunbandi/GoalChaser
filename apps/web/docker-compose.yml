# Docker Compose for Nitya (Goal Chaser)
#
# Prerequisites:
# - Create network once: docker network create nitya_network
# - .env with NEXT_PUBLIC_FIREBASE_* and optional GCS_* (see .env.local.example)
# - GCS key: place at ./gcs-key.json (or set GCS_KEY_FILE_HOST) for upload API

version: '3.8'

services:
  nitya:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY?NEXT_PUBLIC_FIREBASE_API_KEY is required}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN?NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN is required}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID?NEXT_PUBLIC_FIREBASE_PROJECT_ID is required}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET?NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET is required}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID?NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID is required}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID?NEXT_PUBLIC_FIREBASE_APP_ID is required}
    image: nitya:latest
    container_name: nitya
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      GCS_KEY_FILE: /app/gcs-key.json
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
    volumes:
      - ${GCS_KEY_FILE_HOST:-./gcs-key.json}:/app/gcs-key.json:ro
    networks:
      - nitya_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nitya.entrypoints=websecure"
      - "traefik.http.routers.nitya.rule=Host(`nitya.geekynavigator.com`)"
      - "traefik.http.routers.nitya.tls=true"
      - "traefik.http.routers.nitya.tls.certresolver=cloudflare"
      - "traefik.http.services.nitya.loadbalancer.server.port=3000"
      - "traefik.docker.network=nitya_network"

networks:
  nitya_network:
    external: true

