# Docker Compose - Nitya (Goal Chaser)
#
# Prerequisites:
#   1. Create network: docker network create nitya_network
#   2. Add secrets/.env (Firebase, OpenAI, etc.)
#   3. Add secrets/gcs-key.json
#
# Usage: just prod-up

services:
  nitya:
    build:
      context: .
      dockerfile: Dockerfile
    image: nitya:latest
    container_name: nitya
    restart: unless-stopped
    
    expose:
      - "3000"
    
    env_file:
      - ./secrets/.env
    environment:
      NODE_ENV: production
      GCS_KEY_FILE: /app/secrets/gcs-key.json
    
    volumes:
      - ./secrets/gcs-key.json:/app/secrets/gcs-key.json:ro
    
    networks:
      - nitya_network
    
    # Traefik labels
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nitya.entrypoints=websecure"
      - "traefik.http.routers.nitya.rule=Host(`nitya.shagunbandi.com`)"
      - "traefik.http.routers.nitya.tls=true"
      - "traefik.http.routers.nitya.tls.certresolver=cloudflare"
      - "traefik.http.services.nitya.loadbalancer.server.port=3000"
      - "traefik.docker.network=nitya_network"

networks:
  nitya_network:
    external: true
